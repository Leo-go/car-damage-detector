name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build
        env:
          VITE_API_URL: https://example.com
          VITE_ANALYTICS_ENABLED: 'true'

  backend-syntax:
    name: Backend import check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install lightweight deps
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.109.0 uvicorn==0.27.0 opencv-python-headless==4.9.0.80 \
            pillow==10.2.0 python-multipart==0.0.6 pydantic-settings==2.1.0 \
            python-dotenv==1.0.1 numpy==1.26.4

      - name: Import app
        run: python -c "from app.main import app; print('routes', len(app.routes))"
