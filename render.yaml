services:
  - type: web
    name: car-damage-detector-api
    runtime: python
    rootDir: backend
    buildCommand: pip install fastapi==0.109.0 uvicorn==0.27.0 opencv-python-headless==4.9.0.80 pillow==10.2.0 python-multipart==0.0.6 pydantic-settings==2.1.0 python-dotenv==1.0.1 numpy==1.26.4
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        sync: false
      - key: DETECTOR_BACKEND
        value: opencv
      - key: DEMO_MODE
        value: "true"
      - key: PYTHON_VERSION
        value: "3.12.0"
